name: Deploy to TestFlight

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup App Store Connect API Key
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "${{ secrets.APP_STORE_CONNECT_API_KEY }}" > ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_KEY_ID }}.p8
          chmod 600 ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_KEY_ID }}.p8

      - name: Install Distribution Certificate and Trust Chain
        env:
          CERTIFICATE_BASE64: ${{ secrets.DISTRIBUTION_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DISTRIBUTION_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
          KEYCHAIN_PASSWORD="buildkeychain"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          CERT_PATH=$RUNNER_TEMP/certificate.p12
          echo "$CERTIFICATE_BASE64" | base64 --decode > "$CERT_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/xcodebuild

          curl -fL --retry 3 https://www.apple.com/certificateauthority/AppleWWDRCA.cer -o $RUNNER_TEMP/AppleWWDRCA.cer || true
          curl -fL --retry 3 https://www.apple.com/certificateauthority/AppleWWDRCAG2.cer -o $RUNNER_TEMP/AppleWWDRCAG2.cer || true
          curl -fL --retry 3 https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer -o $RUNNER_TEMP/AppleWWDRCAG3.cer || true
          curl -fL --retry 3 https://www.apple.com/certificateauthority/AppleWWDRCAG4.cer -o $RUNNER_TEMP/AppleWWDRCAG4.cer || true
          curl -fL --retry 3 https://www.apple.com/certificateauthority/AppleWWDRCAG5.cer -o $RUNNER_TEMP/AppleWWDRCAG5.cer || true
          curl -fL --retry 3 https://www.apple.com/certificateauthority/AppleWWDRCAG6.cer -o $RUNNER_TEMP/AppleWWDRCAG6.cer || true
          curl -fL --retry 3 https://www.apple.com/appleca/AppleIncRootCertificate.cer -o $RUNNER_TEMP/AppleIncRootCertificate.cer || true
          
          security import $RUNNER_TEMP/AppleWWDRCA.cer -k "$KEYCHAIN_PATH" -T /usr/bin/codesign -T /usr/bin/xcodebuild || true
          security import $RUNNER_TEMP/AppleWWDRCAG2.cer -k "$KEYCHAIN_PATH" -T /usr/bin/codesign -T /usr/bin/xcodebuild || true
          security import $RUNNER_TEMP/AppleWWDRCAG3.cer -k "$KEYCHAIN_PATH" -T /usr/bin/codesign -T /usr/bin/xcodebuild || true
          security import $RUNNER_TEMP/AppleWWDRCAG4.cer -k "$KEYCHAIN_PATH" -T /usr/bin/codesign -T /usr/bin/xcodebuild || true
          security import $RUNNER_TEMP/AppleWWDRCAG5.cer -k "$KEYCHAIN_PATH" -T /usr/bin/codesign -T /usr/bin/xcodebuild || true
          security import $RUNNER_TEMP/AppleWWDRCAG6.cer -k "$KEYCHAIN_PATH" -T /usr/bin/codesign -T /usr/bin/xcodebuild || true
          security import $RUNNER_TEMP/AppleIncRootCertificate.cer -k "$KEYCHAIN_PATH" -T /usr/bin/codesign -T /usr/bin/xcodebuild || true

          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain-db /Library/Keychains/System.keychain

      - name: Debug Certificate Validity
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
          security find-certificate -p -Z "$KEYCHAIN_PATH" > $RUNNER_TEMP/certs.pem
          echo "=== Certificate Details ==="
          openssl x509 -in $RUNNER_TEMP/certs.pem -noout -text | grep -E "Issuer:|Subject:|Not Before:|Not After :"
          echo "=== Certificate Validation ==="
          security verify-cert -c $RUNNER_TEMP/certs.pem || echo "Verification failed locally"

      - name: Install Provisioning Profile
        env:
          PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
        run: |
          PROFILE_PATH=$RUNNER_TEMP/profile.mobileprovision
          echo "$PROVISIONING_PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          PROFILE_UUID=$(security cms -D -i "$PROFILE_PATH" | plutil -extract UUID raw -)
          cp "$PROFILE_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/"$PROFILE_UUID".mobileprovision

      - name: Resolve Swift Package Manager Dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project LosMusicians.xcodeproj \
            -scheme LosMusicians

      - name: Inject API Keys
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          sed -i '' "s/INJECTED_BY_CI/$GEMINI_API_KEY/g" LosMusicians/Services/GeminiService.swift

      - name: Build and Archive (with code signing)
        env:
          CERTIFICATE_PASSWORD: ${{ secrets.DISTRIBUTION_CERTIFICATE_PASSWORD }}
        run: |
          set -o pipefail
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
          security unlock-keychain -p "buildkeychain" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain-db /Library/Keychains/System.keychain

          PROFILE_PATH=$RUNNER_TEMP/profile.mobileprovision
          PROFILE_UUID=$(security cms -D -i "$PROFILE_PATH" | plutil -extract UUID raw -)
          
          sed -i '' "s/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual; CODE_SIGN_IDENTITY = \"Apple Distribution\"; PROVISIONING_PROFILE_SPECIFIER = \"$PROFILE_UUID\";/g" LosMusicians.xcodeproj/project.pbxproj

          xcodebuild archive \
            -project LosMusicians.xcodeproj \
            -scheme LosMusicians \
            -configuration Release \
            -sdk iphoneos \
            -archivePath $PWD/build/LosMusicians.xcarchive \
            -destination 'generic/platform=iOS' \
            DEVELOPMENT_TEAM=PJ32UPL29J \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            OTHER_CODE_SIGN_FLAGS="--keychain $KEYCHAIN_PATH" | xcpretty || {
              echo "xcpretty failed, running raw xcodebuild for full logs..."
              xcodebuild archive \
                -project LosMusicians.xcodeproj \
                -scheme LosMusicians \
                -configuration Release \
                -sdk iphoneos \
                -archivePath $PWD/build/LosMusicians.xcarchive \
                -destination 'generic/platform=iOS' \
                DEVELOPMENT_TEAM=PJ32UPL29J \
                CURRENT_PROJECT_VERSION=${{ github.run_number }} \
                OTHER_CODE_SIGN_FLAGS="--keychain $KEYCHAIN_PATH"
            }

      - name: Export IPA Package
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
          security unlock-keychain -p "buildkeychain" "$KEYCHAIN_PATH"

          PROFILE_PATH=$RUNNER_TEMP/profile.mobileprovision
          PROFILE_UUID=$(security cms -D -i "$PROFILE_PATH" | plutil -extract UUID raw -)

          cat > $RUNNER_TEMP/ExportOptions.plist << PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store-connect</string>
              <key>destination</key>
              <string>export</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>stripSwiftSymbols</key>
              <true/>
              <key>teamID</key>
              <string>PJ32UPL29J</string>
              <key>provisioningProfiles</key>
              <dict>
                  <key>com.vicente.losmusicians</key>
                  <string>$PROFILE_UUID</string>
              </dict>
          </dict>
          </plist>
          PLIST

          xcodebuild -exportArchive \
            -archivePath $PWD/build/LosMusicians.xcarchive \
            -exportPath $PWD/build \
            -exportOptionsPlist $RUNNER_TEMP/ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyID ${{ secrets.APP_STORE_CONNECT_KEY_ID }} \
            -authenticationKeyIssuerID ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }} \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_KEY_ID }}.p8

      - name: Print Xcode Distribution Logs on Failure
        if: failure()
        run: |
          echo "=== Xcode Distribution Logs ==="
          LOG_DIR=$(find /var/folders -type d -name "LosMusicians_*.xcdistributionlogs" 2>/dev/null | sort | tail -1)
          if [ -n "$LOG_DIR" ]; then
            for logfile in "$LOG_DIR"/*.log; do
              echo "--- $(basename "$logfile") ---"
              cat "$logfile" | head -200
            done
          fi

      - name: Upload to TestFlight
        run: |
          IPA_PATH=$(find $PWD/build -name "*.ipa" | head -1)
          xcrun altool --upload-app \
            --type ios \
            --file "$IPA_PATH" \
            --apiKey ${{ secrets.APP_STORE_CONNECT_KEY_ID }} \
            --apiIssuer ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }} \
            --apiPrivateKey ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_KEY_ID }}.p8 \
            --verbose
