name: Deploy to TestFlight

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup App Store Connect API Key
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "${{ secrets.APP_STORE_CONNECT_API_KEY }}" > ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_KEY_ID }}.p8
          chmod 600 ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_KEY_ID }}.p8

      - name: Install Distribution Certificate
        env:
          CERTIFICATE_BASE64: ${{ secrets.DISTRIBUTION_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DISTRIBUTION_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
          KEYCHAIN_PASSWORD="buildkeychain"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          CERT_PATH=$RUNNER_TEMP/certificate.p12
          echo "$CERTIFICATE_BASE64" | base64 --decode > "$CERT_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/xcodebuild
          
          # Download and install Apple WWDR intermediate certificates to establish trust chain
          curl -fLs https://developer.apple.com/certificationauthority/AppleWWDRCA.cer -o $RUNNER_TEMP/AppleWWDRCA.cer
          curl -fLs https://developer.apple.com/certificationauthority/AppleWWDRCAG3.cer -o $RUNNER_TEMP/AppleWWDRCAG3.cer
          curl -fLs https://developer.apple.com/certificationauthority/AppleWWDRCAG6.cer -o $RUNNER_TEMP/AppleWWDRCAG6.cer
          security import $RUNNER_TEMP/AppleWWDRCA.cer -k "$KEYCHAIN_PATH" -T /usr/bin/codesign -T /usr/bin/xcodebuild
          security import $RUNNER_TEMP/AppleWWDRCAG3.cer -k "$KEYCHAIN_PATH" -T /usr/bin/codesign -T /usr/bin/xcodebuild
          security import $RUNNER_TEMP/AppleWWDRCAG6.cer -k "$KEYCHAIN_PATH" -T /usr/bin/codesign -T /usr/bin/xcodebuild

          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain-db /Library/Keychains/System.keychain

          # Verify certificate was imported and is valid
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      - name: Install Provisioning Profile
        env:
          PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
        run: |
          PROFILE_PATH=$RUNNER_TEMP/profile.mobileprovision
          echo "$PROVISIONING_PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          PROFILE_UUID=$(security cms -D -i "$PROFILE_PATH" | plutil -extract UUID raw -)
          cp "$PROFILE_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/"$PROFILE_UUID".mobileprovision
          echo "Installed profile UUID: $PROFILE_UUID"

      - name: Resolve Swift Package Manager Dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project LosMusicians.xcodeproj \
            -scheme LosMusicians

      - name: Inject API Keys
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          sed -i '' "s/INJECTED_BY_CI/$GEMINI_API_KEY/g" LosMusicians/Services/GeminiService.swift

      - name: Build iOS App Archive
        run: |
          xcodebuild archive \
            -project LosMusicians.xcodeproj \
            -scheme LosMusicians \
            -configuration Release \
            -sdk iphoneos \
            -archivePath $PWD/build/LosMusicians.xcarchive \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CURRENT_PROJECT_VERSION=${{ github.run_number }}

      - name: Re-sign Frameworks and App
        env:
          CERTIFICATE_PASSWORD: ${{ secrets.DISTRIBUTION_CERTIFICATE_PASSWORD }}
          CERTIFICATE_BASE64: ${{ secrets.DISTRIBUTION_CERTIFICATE_BASE64 }}
          PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
        run: |
          APP_PATH="$PWD/build/LosMusicians.xcarchive/Products/Applications/LosMusicians.app"
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
          security unlock-keychain -p "buildkeychain" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain-db /Library/Keychains/System.keychain

          # Find the signing identity
          SIGN_IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep "Apple Distribution" | head -1 | awk -F'"' '{print $2}')
          echo "Signing with: $SIGN_IDENTITY"

          # Install provisioning profile into the app
          PROFILE_PATH=$RUNNER_TEMP/profile.mobileprovision
          cp "$PROFILE_PATH" "$APP_PATH/embedded.mobileprovision"

          # Re-sign all frameworks first (deepest first)
          find "$APP_PATH/Frameworks" -name "*.framework" | while read framework; do
            codesign --force --sign "$SIGN_IDENTITY" --keychain "$KEYCHAIN_PATH" "$framework"
          done

          # Re-sign the app itself with clean entitlements (no iCloud wildcards)
          ENTITLEMENTS_PATH=$RUNNER_TEMP/entitlements.plist
          python3 scripts/generate_entitlements.py

          codesign --force --sign "$SIGN_IDENTITY" --keychain "$KEYCHAIN_PATH" \
            --entitlements "$ENTITLEMENTS_PATH" \
            "$APP_PATH"

          echo "Re-signing complete"
          codesign -dv "$APP_PATH" 2>&1 | head -10

      - name: Export IPA Package
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
          security unlock-keychain -p "buildkeychain" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain-db /Library/Keychains/System.keychain
          xcodebuild -exportArchive \
            -archivePath $PWD/build/LosMusicians.xcarchive \
            -exportPath $PWD/build \
            -exportOptionsPlist ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyID ${{ secrets.APP_STORE_CONNECT_KEY_ID }} \
            -authenticationKeyIssuerID ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }} \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_KEY_ID }}.p8

      - name: Print Xcode Distribution Logs on Failure
        if: failure()
        run: |
          echo "=== Xcode Distribution Logs ==="
          LOG_DIR=$(find /var/folders -type d -name "LosMusicians_*.xcdistributionlogs" 2>/dev/null | sort | tail -1)
          if [ -n "$LOG_DIR" ]; then
            echo "Found logs at: $LOG_DIR"
            for logfile in "$LOG_DIR"/*.log; do
              echo "--- $(basename "$logfile") ---"
              cat "$logfile" | head -100
            done
          else
            echo "No logs found under /var/folders"
          fi

      - name: Upload Build to TestFlight
        run: |
          xcrun altool --upload-app \
            --type ios \
            --file $PWD/build/LosMusicians.ipa \
            --apiKey ${{ secrets.APP_STORE_CONNECT_KEY_ID }} \
            --apiIssuer ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }} \
            --apiPrivateKey ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_KEY_ID }}.p8
